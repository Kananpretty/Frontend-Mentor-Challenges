<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;800&display=swap"
      rel="stylesheet"
    />
    <title>Blog Card Preview</title>
  </head>
  <body>
    <main class="blog-page">
      <article class="blog-card">
        <img
          src="./images/illustration-article.svg"
          alt=""
          class="blog-illustration-image"
        />
        <section class="blog-content">
          <p class="blog-category-tag">Learning</p>
          <time datetime="2023-12-21" class="blog-published-date"
            >Published 21 Dec 2023</time
          >
          <h1 class="blog-title">HTML & CSS foundations</h1>
          <p class="blog-description">
            These languages are the backbone of every website, defining
            structure, content, and presentation
          </p>
        </section>
        <footer class="blog-author">
          <img
            src="./images/image-avatar.webp"
            alt=""
            class="blog-author-avatar"
          />
          <p class="blog-author-name">Greg Hooper</p>
        </footer>
      </article>
    </main>
  </body>
</html>
