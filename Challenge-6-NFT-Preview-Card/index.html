<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css?family=Outfit:300,400,600"
      rel="stylesheet"
    />
    <title>NFT Preview Card</title>
  </head>
  <body>
    <main class="NFT-preview-page">
      <article class="NFT-preview-card">
        <div class="NFT-image-container">
          <img
            src="./images/image-equilibrium.jpg"
            alt="Equilibrium #3429 NFT"
            class="NFT-image"
          />

          <div class="NFT-image-overlay">
            <img src="./images/icon-view.svg" alt="" class="NFT-view-icon" />
          </div>
        </div>
        <section class="NFT-details">
          <a class="NFT-title" href="#">Equilibrium #3429</a>
          <p class="NFT-description">
            Our Equilibrium collection promotes balance and calm
          </p>
          <div class="NFT-price-time">
            <div class="NFT-price">
              <img
                src="./images/icon-ethereum.svg"
                alt=""
                class="NFT-ethereum-icon"
              />
              <strong class="NFT-ethereum-text">0.041 ETH</strong>
            </div>
            <div class="NFT-time">
              <img src="./images/icon-clock.svg" alt="" class="NFT-time-icon" />
              <span class="NFT-time-text">3 days left</span>
            </div>
          </div>
        </section>
        <hr class="divider" />
        <footer class="NFT-creator-details">
          <img
            src="./images/image-avatar.png"
            alt="Jules Wyvern"
            class="NFT-creator-avatar"
          />
          <p class="NFT-creator-name">
            Creation of <a class="creator-name" href="#">Jules Wyvern</a>
          </p>
        </footer>
      </article>
    </main>
  </body>
</html>
