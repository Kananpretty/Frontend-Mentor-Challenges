<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css?family=Inter:400, 700|Lexend+Deca:400"
      rel="stylesheet"
    />
    <title>Stats Preview Card</title>
  </head>
  <body>
    <main class="stats-preview-page">
      <article class="stats-preview-card">
        <section class="stats-details">
          <h1 class="stats-heading">
            Get <span class="purple">insights</span> that help your business
            grow
          </h1>
          <p class="stats-description">
            Discover the benefits of data analytics and make better decisions
            regarding revenue, customer experience, and overall efficiency
          </p>
          <ul class="stats-values">
            <li class="stats-companies">
              <strong class="company-value">10k+</strong>
              <span class="company-label">COMPANIES</span>
            </li>
            <li class="stats-templates">
              <strong class="template-value">314</strong>
              <span class="template-label">TEMPLATES</span>
            </li>
            <li class="stats-queries">
              <strong class="query-value">12M+</strong>
              <span class="query-label">QUERIES</span>
            </li>
          </ul>
        </section>
        <picture class="stats-illustration">
          <source
            media="(max-width: 480px)"
            srcset="./images/image-header-mobile.jpg"
          />
          <img src="./images/image-header-desktop.jpg" alt="" />
        </picture>
      </article>
    </main>
  </body>
</html>
