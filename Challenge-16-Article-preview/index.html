<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Article Preview</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css?family=Manrope:500,700"
      rel="stylesheet"
    />
  </head>
  <body>
    <article class="article">
      <img
        src="./images/drawers.jpg"
        class="article-image"
        alt="A drawer cabinet in a modern living room"
      />
      <section class="article-details">
        <h1 class="article-heading">
          Shift the overall look and feel by adding these wonderful touches to
          furniture in your home
        </h1>
        <p class="article-description">
          Ever been in a room and felt like something was missing? Perhaps it
          felt slightly bare and uninviting. I've got some simple tips to help
          you make any room feel complete
        </p>
        <section class="author-section">
          <div class="author-details">
            <img
              class="author-avatar"
              src="./images/avatar-michelle.jpg"
              alt="Michelle Appleton"
            />
            <div class="author-identity">
              <span class="author-name">Michelle Appleton</span>
              <span class="publishing-date">28 Jun 2020</span>
            </div>
          </div>
          <div class="article-share-options">
            <button
              class="share-button"
              aria-label="Share article"
              aria-expanded="false"
            >
              <img class="share-icon" src="./images/icon-share.svg" alt="" />
            </button>
          </div>
        </section>
        <div class="share-details">
          <span>SHARE</span>
          <ul class="share-option-list">
            <li class="share-option-list-item">
              <a href="#" class="share-link">
                <img
                  src="./images/icon-facebook.svg"
                  class="share-option-icon"
                  alt="facebook"
                />
              </a>
            </li>
            <li class="share-option-list-item">
              <a href="#" class="share-link">
                <img
                  src="./images/icon-twitter.svg"
                  class="share-option-icon"
                  alt="twitter"
                />
              </a>
            </li>
            <li class="share-option-list-item">
              <a href="#" class="share-link">
                <img
                  src="./images/icon-pinterest.svg"
                  class="share-option-icon"
                  alt="pinterest"
                />
              </a>
            </li>
          </ul>
        </div>
      </section>
    </article>
    <script src="./script.js"></script>
  </body>
</html>
