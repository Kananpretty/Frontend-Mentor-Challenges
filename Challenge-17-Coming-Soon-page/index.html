<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Base Apparel Coming Soon</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css?family=Josefin+Sans:300,400,600"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="base-apparel-coming-soon-main">
      <div class="base-apparel-coming-soon">
        <div class="base-apparel-details">
          <header>
            <img
              class="base-apparel-logo"
              alt="Base Apparel Logo"
              src="./images/logo.svg"
            />
          </header>
          <section class="coming-soon-details">
            <h1 class="coming-soon-header">
              <span class="pink-color">WE'RE</span> COMING SOON
            </h1>
            <p class="coming-soon-subheader">
              Hello fellow shoppers! We're currently building our new fashion
              store. Add your email below to stay up-to-date with announcements
              and our launch deals
            </p>
            <div class="subscriber-contact-form">
              <form novalidate>
                <label for="email" class="email-label">Email Address</label>

                <div class="input-wrapper">
                  <input
                    type="email"
                    name="email"
                    class="subscriber-email"
                    id="email"
                    autocomplete="email"
                    aria-describedby="email-error"
                    aria-invalid="false"
                    placeholder="Email Address"
                    required
                  />
                  <img
                    class="error-icon"
                    src="./images/icon-error.svg"
                    alt=""
                    aria-hidden="true"
                  />
                  <button
                    type="submit"
                    class="submit-contact-form"
                    aria-label="Submit email"
                  >
                    <img
                      class="submit-icon"
                      src="./images/icon-arrow.svg"
                      alt=""
                    />
                  </button>
                </div>
                <p class="error-message" id="email-error" role="alert">
                  Please provide a valid email
                </p>
              </form>
            </div>
          </section>
        </div>
        <picture class="base-apparel-hero-image">
          <source
            media="(max-width: 768px)"
            srcset="./images/hero-mobile.jpg"
          />
          <img
            src="./images/hero-desktop.jpg"
            alt="Base Apparel Coming Soon Image"
          />
        </picture>
      </div>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
