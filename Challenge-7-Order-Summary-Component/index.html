<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css?family=Red+Hat+Display:500, 700, 900"
      rel="stylesheet"
    />
    <title>Order Summary</title>
  </head>
  <body>
    <main class="order-summary-page">
      <article class="order-summary-card">
        <img src="./images/illustration-hero.svg" alt="" class="hero-banner" />
        <div class="order-summary-details">
          <h1 class="order-summary-header">Order Summary</h1>
          <p class="order-summary-info">
            You can now listen to millions of songs, audiobooks, and podcasts on
            any device anywhere you like!
          </p>
          <div class="order-selected-details">
            <div class="order-selected">
              <img src="./images/icon-music.svg" class="music-icon" alt="" />
              <div class="order-plan-details">
                <p class="order-plan-name">Annual Plan</p>
                <p class="order-plan-price">$59.99/year</p>
              </div>
            </div>
            <a href="#" class="change-link">Change</a>
          </div>
          <div class="order-buttons">
            <button class="order-submit" type="button">
              Proceed to Payment
            </button>
            <a class="order-cancel" href="#">Cancel Order</a>
          </div>
        </div>
      </article>
    </main>
  </body>
</html>
