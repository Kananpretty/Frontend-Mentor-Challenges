<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css?family=Inter:400,600,700&display=swap"
      rel="stylesheet"
    />
    <title>Social Links Profile Card</title>
  </head>
  <body>
    <main class="social-links-profile-page">
      <article class="social-links-profile-card">
        <img
          class="profile-avatar-picture"
          src="./images/avatar-jessica.jpeg"
          alt="Jessica Randall"
        />
        <div class="profile-description">
          <h1 class="profile-name">Jessica Randall</h1>
          <p class="profile-location">London, United Kingdom</p>
        </div>
        <p class="profile-tagline">"Front-end developer and avid reader"</p>
        <nav class="profile-social-links">
          <ul>
            <li>
              <a href="#" class="social-links">Github</a>
            </li>
            <li>
              <a href="#" class="social-links">Frontend Mentor</a>
            </li>
            <li>
              <a href="#" class="social-links">Linkedin</a>
            </li>
            <li>
              <a href="#" class="social-links">Twitter</a>
            </li>
            <li>
              <a href="#" class="social-links">Instagram</a>
            </li>
          </ul>
        </nav>
      </article>
    </main>
  </body>
</html>
