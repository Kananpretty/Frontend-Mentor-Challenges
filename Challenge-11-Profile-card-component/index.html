<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Profile Card Component</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css?family=Kumbh+Sans:400,700"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="profile-card">
      <div class="profile-picture-section">
        <img
          src="./images/image-victor.jpg"
          alt="Victor Crest"
          class="profile-image"
        />
      </div>
      <div class="profile-details">
        <h1 class="profile-name">
          Victor Crest <span class="profile-age">26</span>
        </h1>
        <p class="profile-location">London</p>
      </div>
      <hr class="divider" />
      <div class="profile-social-stats">
        <ul class="social-stats-list">
          <li class="social-stat-list-item">
            <span class="stat-value">80K</span>
            <span class="stat-label">Followers</span>
          </li>
          <li class="social-stat-list-item">
            <span class="stat-value">803K</span>
            <span class="stat-label">Likes</span>
          </li>
          <li class="social-stat-list-item">
            <span class="stat-value">1.4K</span>
            <span class="stat-label">Photos</span>
          </li>
        </ul>
      </div>
    </main>
  </body>
</html>
